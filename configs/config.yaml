# ── Data ──────────────────────────────────────────────────────────────────────
data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  # Subset: 3 stores to keep things tractable locally
  stores: ["CA_1", "TX_1", "WI_1"]
  # Set to null to use all stores
  # stores: null

# ── Forecast horizon ──────────────────────────────────────────────────────────
forecast:
  horizon: 28          # days (matches M5 competition)
  freq: "D"
  level_cols: ["state_id", "store_id", "cat_id", "dept_id", "item_id"]

# ── Backtesting ───────────────────────────────────────────────────────────────
backtest:
  n_folds: 4
  step_size: 28        # how many days to advance each fold origin

# ── Probabilistic ─────────────────────────────────────────────────────────────
uncertainty:
  quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
  coverage_target: 0.80   # for conformal intervals

# ── LightGBM ─────────────────────────────────────────────────────────────────
lgbm:
  n_estimators: 1000
  learning_rate: 0.05
  num_leaves: 127
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  n_jobs: -1
  random_state: 42
  # Optuna
  n_trials: 50
  optuna_timeout: 600   # seconds

# ── MLflow ────────────────────────────────────────────────────────────────────
mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "m5-forecasting"

# ── Serving ───────────────────────────────────────────────────────────────────
api:
  host: "0.0.0.0"
  port: 8000

# ── Monitoring ────────────────────────────────────────────────────────────────
monitoring:
  drift_threshold: 0.10   # relative WAPE degradation that triggers alert
  reference_window: 56    # days of history used as baseline
