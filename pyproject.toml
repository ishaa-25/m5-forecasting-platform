[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "m5forecast"
version = "0.1.0"
description = "Probabilistic hierarchical forecasting platform on the M5 Walmart dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "polars>=0.20",
    "pyarrow>=14",
    "duckdb>=0.10",
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "optuna>=3.5",
    "mlflow>=2.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.33",
    "plotly>=5.20",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pytest>=8.1",
    "ruff>=0.4",
]

[project.optional-dependencies]
advanced = [
    "chronos-forecasting>=1.3",
    "neuralforecast>=1.7",
    "hierarchicalforecast>=0.4",
    "mapie>=0.8",
    "transformers>=4.40",
    "torch>=2.2",
]
llm = [
    "openai>=1.20",
    "langchain>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
